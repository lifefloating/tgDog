# tgDog 全栈部署：VPS 上配好 .env（媒体存储填 Cloudflare R2）后一条命令拉起全部服务
#
#   docker compose up -d --build
#
# 默认包含：postgres（数据库）+ migrate（自动跑 prisma migrate deploy）
#           + collector（采集）+ web（界面，:3000）
#
# 不用 Cloudflare R2、想本地存媒体时才需要 MinIO（profile: minio）：
#   docker compose --profile minio up -d --build
#   此时 .env 里 R2_ENDPOINT 要写 http://minio:9000（容器内服务名）
#
# 注意：postgres / minio 端口只绑定 127.0.0.1，不暴露公网；web 的 3000 对外。
# 仅起基础设施（本机开发）：docker compose --profile minio up -d postgres minio minio-init

services:
  postgres:
    image: postgres:17-alpine
    container_name: tgdog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tgdog
      POSTGRES_PASSWORD: tgdog
      POSTGRES_DB: tgdog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgdog -d tgdog"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 可选：S3 兼容存储，仅在不用 Cloudflare R2 时启用（--profile minio）
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: tgdog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # 控制台
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 自动创建 bucket 并设为公开读（幂等，重复执行无副作用）
  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    container_name: tgdog-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/tgdog-media &&
      mc anonymous set download local/tgdog-media &&
      echo 'bucket tgdog-media 已就绪（公开读）';
      "

  # 一次性任务：对 postgres 执行 prisma migrate deploy（幂等）
  migrate:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    image: tgdog-collector
    container_name: tgdog-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tgdog:tgdog@postgres:5432/tgdog
    command: ["sh", "-c", "cd packages/db && pnpm exec prisma migrate deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    image: tgdog-collector
    container_name: tgdog-collector
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tgdog:tgdog@postgres:5432/tgdog
      COLLECTOR_LOGIN_PORT: "8787"
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: tgdog-web
    container_name: tgdog-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tgdog:tgdog@postgres:5432/tgdog
      COLLECTOR_LOGIN_URL: http://collector:8787
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      collector:
        condition: service_started

volumes:
  pgdata:
  miniodata:
